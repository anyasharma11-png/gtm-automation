name: Daily Pipeline Run

on:
  schedule:
    # 7:00 AM PDT = 2:00 PM UTC (adjust if your timezone changes with DST)
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from GitHub's Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated state files back

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Google token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Diagnose token scopes (safe -- doesn't expose secrets)
        run: |
          python3 -c "
          import json
          with open('token.json') as f:
              data = json.load(f)
          print('Scopes found in token.json:')
          for s in data.get('scopes', []):
              print(' -', s)
          print('Has refresh_token:', bool(data.get('refresh_token')))
          print('Has client_id:', bool(data.get('client_id')))
          "

      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: Run pipeline
        env:
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          python3 run_all.py || true
          python3 create_deals.py || true
          python3 deal_coaching.py || true
          python3 harvest_to_drive.py

      - name: Update distributable template on Google Drive
        run: python3 package_for_drive.py

      - name: Commit updated state files back to repo
        run: |
          git config user.name "GTM Automation Bot"
          git config user.email "actions@github.com"
          git add apollo_usage.json apollo_seen_ids.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto-update: daily pipeline state $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
